name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/736023550280/locations/global/workloadIdentityPools/blitz-lz-github-pool/providers/blitz-lz-github-provider
          service_account: blitz-lz-github-actions@blitz-ksa.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: |
          gcloud run deploy capcut-srt \
            --source . \
            --project blitz-ksa \
            --region europe-west1 \
            --min-instances 0 \
            --max-instances 3 \
            --memory 512Mi \
            --allow-unauthenticated \
            --quiet
